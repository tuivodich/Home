name: Deploy Cloud Functions (bot Telegram)

# Chạy khi sửa thư mục functions/ hoặc bấm tay. Tách riêng khỏi deploy.yml để lỗi ở đây
# (thiếu quyền, chưa có token bot…) không làm hỏng việc đăng trang web.
on:
  push:
    branches: [main]
    paths: ["functions/**", "firebase.json"]
  workflow_dispatch:

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Cài thư viện functions
        run: npm ci --prefix functions
      - name: Deploy functions
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "::notice::Chưa có secret TELEGRAM_BOT_TOKEN trong GitHub → bỏ qua deploy bot. Xem docs/telegram-bot.md."
            exit 0
          fi
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          # Lưu token vào Secret Manager (không nằm trong mã nguồn); chỉ tạo phiên bản mới khi giá trị đổi.
          printf '%s' "$BOT_TOKEN" | npx firebase-tools functions:secrets:set TELEGRAM_BOT_TOKEN --data-file - --force --project sisterhome
          npx firebase-tools deploy --only functions --project sisterhome --force
