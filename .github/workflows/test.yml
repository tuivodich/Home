name: Kiểm thử

on:
  pull_request:
  push:
    branches-ignore: [main] # nhánh main đã được kiểm thử ngay trước khi deploy

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21 # Firestore Emulator cần JDK 21+
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Kiểm thử (tính giá, báo cáo, luật Firestore, bot Telegram)
        run: npm test
